<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Dashboard - Manage Doctors</title>
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg-color: #0F172A;
            --text-color: #F8FAFC;
            --card-bg: rgba(30, 41, 59, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --danger: #EF4444;
            --success: #10B981;
            --warning: #F59E0B;
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(at 0% 0%, rgba(79, 70, 229, 0.15) 0px, transparent 50%);
            color: var(--text-color);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .header h1 {
            background: linear-gradient(to right, #60A5FA, #A78BFA);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .header-actions {
            display: flex;
            gap: 15px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }
        
        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
        }

        .btn-danger {
            background: rgba(239, 68, 68, 0.2);
            color: #FCA5A5;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .btn-danger:hover {
            background: rgba(239, 68, 68, 0.3);
        }
        
        .btn-sm {
            padding: 6px 12px;
            font-size: 13px;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
        }

        .doctor-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .doctor-card {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            position: relative;
            transition: transform 0.3s ease;
        }
        
        .doctor-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            border-color: rgba(96, 165, 250, 0.3);
        }

        .doctor-card h3 {
            color: #60A5FA;
            margin-bottom: 12px;
            font-size: 20px;
        }

        .doctor-card p {
            color: #94A3B8;
            font-size: 14px;
            margin-bottom: 8px;
        }
        
        .doctor-actions {
            margin-top: 15px;
            display: flex;
            gap: 10px;
            padding-top: 15px;
            border-top: 1px solid var(--border-color);
        }

        /* Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 30px;
            width: 100%;
            max-width: 500px;
            transform: translateY(20px);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal {
            transform: translateY(0);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #CBD5E1;
        }

        .form-group input {
            width: 100%;
            padding: 10px 14px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: white;
            outline: none;
            transition: border-color 0.3s;
        }
        
        .form-group input:focus {
            border-color: #60A5FA;
        }
        
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 25px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Doctor Management Dashboard</h1>
            <div class="header-actions">
                <button class="btn-primary" onclick="openModal()">+ Add New Doctor</button>
                <button class="btn-danger" onclick="handleLogout()">Logout</button>
            </div>
        </div>

        <div class="card">
            <h2>Registered Doctors</h2>
            <p style="margin: 10px 0 20px 0; color: #94A3B8;">Full CRUD Interface matching the API.</p>
            <div class="doctor-list" id="doctorList">
                <p>Loading doctors...</p>
            </div>
        </div>
    </div>

    <!-- Doctor Form Modal -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <h2 id="modalTitle" style="margin-bottom: 20px;">Add Doctor</h2>
            <form id="doctorForm" onsubmit="handleSave(event)">
                <input type="hidden" id="doctorId">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="docName" required>
                </div>
                <div class="form-group">
                    <label>Specialty</label>
                    <select id="docSpecialty" required style="width: 100%; padding: 10px 14px; background: rgba(15, 23, 42, 0.6); border: 1px solid var(--border-color); border-radius: 8px; color: white; outline: none; transition: border-color 0.3s;">
                        <option value="" disabled selected style="color: #000;">Select a specialty...</option>
                        <option value="Allergy and Immunology" style="color: #000;">Allergy and Immunology</option>
                        <option value="Anesthesiology" style="color: #000;">Anesthesiology</option>
                        <option value="Cardiology" style="color: #000;">Cardiology</option>
                        <option value="Cardiothoracic Surgery" style="color: #000;">Cardiothoracic Surgery</option>
                        <option value="Dermatology" style="color: #000;">Dermatology</option>
                        <option value="Endocrinology" style="color: #000;">Endocrinology</option>
                        <option value="Emergency Medicine" style="color: #000;">Emergency Medicine</option>
                        <option value="Family Medicine" style="color: #000;">Family Medicine</option>
                        <option value="Gastroenterology" style="color: #000;">Gastroenterology</option>
                        <option value="General Surgery" style="color: #000;">General Surgery</option>
                        <option value="Geriatrics" style="color: #000;">Geriatrics</option>
                        <option value="Hematology" style="color: #000;">Hematology</option>
                        <option value="Infectious Disease" style="color: #000;">Infectious Disease</option>
                        <option value="Internal Medicine" style="color: #000;">Internal Medicine</option>
                        <option value="Nephrology" style="color: #000;">Nephrology</option>
                        <option value="Neurology" style="color: #000;">Neurology</option>
                        <option value="Neurosurgery" style="color: #000;">Neurosurgery</option>
                        <option value="Obstetrics and Gynecology" style="color: #000;">Obstetrics and Gynecology</option>
                        <option value="Oncology" style="color: #000;">Oncology</option>
                        <option value="Ophthalmology" style="color: #000;">Ophthalmology</option>
                        <option value="Orthopedic Surgery" style="color: #000;">Orthopedic Surgery</option>
                        <option value="Otolaryngology (ENT)" style="color: #000;">Otolaryngology (ENT)</option>
                        <option value="Pathology" style="color: #000;">Pathology</option>
                        <option value="Pediatrics" style="color: #000;">Pediatrics</option>
                        <option value="Physical Medicine and Rehabilitation" style="color: #000;">Physical Medicine and Rehabilitation</option>
                        <option value="Plastic Surgery" style="color: #000;">Plastic Surgery</option>
                        <option value="Psychiatry" style="color: #000;">Psychiatry</option>
                        <option value="Pulmonology" style="color: #000;">Pulmonology</option>
                        <option value="Radiology" style="color: #000;">Radiology</option>
                        <option value="Rheumatology" style="color: #000;">Rheumatology</option>
                        <option value="Urology" style="color: #000;">Urology</option>
                        <option value="Vascular Surgery" style="color: #000;">Vascular Surgery</option>
                        <option value="Other" style="color: #000;">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Experience (Years)</label>
                    <input type="number" id="docExperience" min="0" required>
                </div>
                <div class="form-group">
                    <label>Contact Number</label>
                    <input type="text" id="docContact" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="docEmail" required>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn-danger" style="background: transparent;" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn-primary">Save Profile</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if (!token) window.location.href = '/';

        // Read (List)
        async function fetchDoctors() {
            try {
                const response = await fetch('/api/profiles/doctors/', {
                    headers: { 'Authorization': `Token ${token}` }
                });
                if (response.status === 401) return handleLogout();
                
                const doctors = await response.json();
                const list = document.getElementById('doctorList');
                
                if (doctors.length === 0) {
                    list.innerHTML = '<p>No doctors registered yet.</p>';
                    return;
                }

                list.innerHTML = doctors.map(doc => `
                    <div class="doctor-card">
                        <h3>${doc.name}</h3>
                        <p><strong>Specialty:</strong> ${doc.specialty}</p>
                        <p><strong>Experience:</strong> ${doc.experience_years} years</p>
                        <p><strong>Contact:</strong> ${doc.contact_number}</p>
                        <p><strong>Email:</strong> ${doc.email}</p>
                        <div class="doctor-actions">
                            <button class="btn-primary btn-sm" onclick='editDoctor(${JSON.stringify(doc).replace(/'/g, "&#39;")})'>Edit</button>
                            <button class="btn-danger btn-sm" onclick="deleteDoctor(${doc.id})">Delete</button>
                        </div>
                    </div>
                `).join('');
            } catch (err) {
                document.getElementById('doctorList').innerHTML = '<p>Error loading doctors.</p>';
            }
        }

        // Modal Controls
        function openModal() {
            document.getElementById('modalTitle').innerText = 'Add New Doctor';
            document.getElementById('doctorForm').reset();
            document.getElementById('doctorId').value = '';
            document.getElementById('modalOverlay').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
        }

        // Populate form for Edit (Update)
        function editDoctor(doc) {
            document.getElementById('modalTitle').innerText = 'Edit Doctor Profile';
            document.getElementById('doctorId').value = doc.id;
            document.getElementById('docName').value = doc.name;
            document.getElementById('docSpecialty').value = doc.specialty;
            document.getElementById('docExperience').value = doc.experience_years;
            document.getElementById('docContact').value = doc.contact_number;
            document.getElementById('docEmail').value = doc.email;
            document.getElementById('modalOverlay').classList.add('active');
        }

        // Create / Update
        async function handleSave(e) {
            e.preventDefault();
            const id = document.getElementById('doctorId').value;
            
            const payload = {
                name: document.getElementById('docName').value,
                specialty: document.getElementById('docSpecialty').value,
                experience_years: document.getElementById('docExperience').value,
                contact_number: document.getElementById('docContact').value,
                email: document.getElementById('docEmail').value
            };

            const url = id ? `/api/profiles/doctors/${id}/` : '/api/profiles/doctors/';
            const method = id ? 'PUT' : 'POST';

            try {
                const response = await fetch(url, {
                    method: method,
                    headers: {
                        'Authorization': `Token ${token}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(payload)
                });
                
                if (response.ok) {
                    closeModal();
                    fetchDoctors(); // Refresh list
                } else {
                    const data = await response.json();
                    alert('Error saving: ' + JSON.stringify(data));
                }
            } catch (err) {
                alert('An error occurred while saving.');
            }
        }

        // Delete
        async function deleteDoctor(id) {
            if (!confirm('Are you sure you want to delete this doctor profile?')) return;
            
            try {
                const response = await fetch(`/api/profiles/doctors/${id}/`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Token ${token}` }
                });
                
                if (response.ok || response.status === 204) {
                    fetchDoctors(); // Refresh list
                } else {
                    alert('Failed to delete.');
                }
            } catch (err) {
                alert('An error occurred during deletion.');
            }
        }

        async function handleLogout() {
            try {
                await fetch('/api/accounts/logout/', {
                    method: 'POST',
                    headers: { 'Authorization': `Token ${token}` }
                });
            } catch (err) {}
            localStorage.removeItem('token');
            window.location.href = '/';
        }

        // Initialize
        fetchDoctors();
    </script>
</body>
</html>
