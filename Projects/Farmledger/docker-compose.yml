version: '3.8'

services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_DB: farmledger
      POSTGRES_USER: farmledger
      POSTGRES_PASSWORD: farmledger
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    restart: unless-stopped
    ports:
      - "6379:6379"

  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: gunicorn Farmledger.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgres://farmledger:farmledger@db:5432/farmledger
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"

  celery:
    build:
      context: .
      dockerfile: Dockerfile
    command: celery -A Farmledger worker --loglevel=info
    volumes:
      - .:/app
    environment:
      - DATABASE_URL=postgres://farmledger:farmledger@db:5432/farmledger
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app

volumes:
  db_data:
