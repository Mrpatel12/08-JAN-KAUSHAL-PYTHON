{% extends 'base.html' %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card shadow-sm">
        <div class="card-body">
          <h2 class="card-title">Signed in successfully</h2>
          <p class="small">Keep these tokens private. Use them to authenticate API requests.</p>
          <div class="mb-3">
            <label class="form-label">Access token</label>
            <pre class="p-2 bg-light border">{{ token_data.access }}</pre>
          </div>
          <div class="mb-3">
            <label class="form-label">Refresh token</label>
            <pre class="p-2 bg-light border">{{ token_data.refresh }}</pre>
          </div>
          <div class="mb-3">
            <label class="form-label">User</label>
            <pre class="p-2 bg-light border">{{ token_data.user }}</pre>
          </div>
          <p><a class="btn btn-secondary" href="{% url 'landing' %}">Back to home</a></p>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
