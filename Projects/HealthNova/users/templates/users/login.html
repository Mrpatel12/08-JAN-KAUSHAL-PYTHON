{% extends 'base.html' %}
{% load form_tags %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow-sm">
        <div class="card-body">
          <h2 class="card-title mb-3">Sign in to your account</h2>
          <form method="post" novalidate class="needs-validation">
            {% csrf_token %}
            {% for field in form %}
              <div class="mb-3">
                <label class="form-label">{{ field.label }}</label>
                {{ field|add_class:"form-control" }}
                {% if field.errors %}
                  <div class="invalid-feedback d-block">{{ field.errors|striptags }}</div>
                {% endif %}
              </div>
            {% endfor %}
            <button class="btn btn-primary w-100" type="submit">Sign in</button>
          </form>
          <p class="mt-3 text-center small">Don't have an account? <a href="{% url 'signup' %}">Sign up</a></p>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
