{% extends "base.html" %}
{% block title %}Payment Failed | Bookaro{% endblock %}

{% block content %}
<section class="section" style="min-height: 80vh; display: flex; align-items: center; justify-content: center;">
    <div style="text-align: center; max-width: 500px; padding: 3rem; background: var(--bg-card); border-radius: var(--radius-xl); border: 1px solid var(--border); box-shadow: var(--shadow-xl);">
        <div style="width: 80px; height: 80px; background: rgba(239, 68, 68, 0.1); color: #ef4444; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; margin: 0 auto 1.5rem;">
            <i class="fa-solid fa-xmark"></i>
        </div>
        <h2 style="margin-bottom: 1rem; color: var(--text-main);">Payment Failed!</h2>
        <p style="color: var(--text-muted); margin-bottom: 2rem;">We could not verify your payment signature. Please try again or contact support if money was deducted from your account.</p>
        
        <a href="{% url 'home' %}" class="btn btn-primary">Return Home</a>
    </div>
</section>
{% endblock %}
