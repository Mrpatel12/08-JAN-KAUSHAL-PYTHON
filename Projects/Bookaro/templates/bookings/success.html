{% extends "base.html" %}
{% block title %}Payment Successful | Bookaro{% endblock %}

{% block content %}
<section class="section" style="min-height: 80vh; display: flex; align-items: center; justify-content: center;">
    <div style="text-align: center; max-width: 500px; padding: 3rem; background: var(--bg-card); border-radius: var(--radius-xl); border: 1px solid var(--border); box-shadow: var(--shadow-xl);">
        <div style="width: 80px; height: 80px; background: rgba(16, 185, 129, 0.1); color: #10b981; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; margin: 0 auto 1.5rem;">
            <i class="fa-solid fa-check"></i>
        </div>
        <h2 style="margin-bottom: 1rem; color: var(--text-main);">Payment Successful!</h2>
        <p style="color: var(--text-muted); margin-bottom: 2rem;">Your booking (ID: #{{ booking.id }}) has been confirmed successfully. A confirmation email has been sent to your registered email address.</p>
        
        <div style="display: flex; gap: 1rem; justify-content: center;">
            <a href="{% url 'home' %}" class="btn btn-outline">Back to Home</a>
        </div>
    </div>
</section>
{% endblock %}
